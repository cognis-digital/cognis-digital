name: Refresh profile stats

# Keeps the README's featured tables, star counts, and headline numbers in sync
# with the live GitHub API. Runs daily and on demand; commits only when something
# actually changed.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate README live sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "cognis-stats-bot"
            git config user.email "actions@github.com"
            git add README.md
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          else
            echo "README already up to date."
          fi
